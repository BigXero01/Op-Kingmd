[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "op-kingmd"
version = "0.1.0"
description = "Top-tier Web3-focused coding LLM for vibe coding, rapid prototyping, and smart contract development"
authors = [{ name = "Op-Kingmd Team" }]
license = { text = "MIT" }
requires-python = ">=3.10"
readme = "README.md"
keywords = ["web3", "solidity", "llm", "smart-contracts", "blockchain", "AI", "code-generation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    # Hugging Face ecosystem
    "transformers>=4.44.0",
    "tokenizers>=0.19.0",
    "datasets>=2.20.0",
    "huggingface-hub>=0.24.0",
    "accelerate>=0.33.0",
    "peft>=0.12.0",
    "trl>=0.9.6",
    "bitsandbytes>=0.43.0",
    "safetensors>=0.4.0",
    # Inference & serving
    "fastapi>=0.112.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    # CLI
    "click>=8.1.7",
    "rich>=13.7.0",
    "typer>=0.12.0",
    # GitHub integration
    "PyGithub>=2.3.0",
    "gitpython>=3.1.43",
    # Web3 / blockchain tooling
    "web3>=7.0.0",
    "eth-abi>=5.1.0",
    "eth-utils>=4.1.0",
    "solc-select>=1.0.4",
    # Security / Audit
    "slither-analyzer>=0.10.0",
    "semgrep>=1.82.0",
    # Utilities
    "PyYAML>=6.0.1",
    "toml>=0.10.2",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
    "aiofiles>=24.1.0",
    "jinja2>=3.1.4",
    "markdown>=3.7",
    "packaging>=24.1",
    "structlog>=24.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.8",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pre-commit>=3.8.0",
]
gpu = [
    "flash-attn>=2.6.0",
    "xformers>=0.0.27",
    "vllm>=0.5.4",
]
report = [
    "weasyprint>=62.0",
    "reportlab>=4.2.0",
    "matplotlib>=3.9.0",
]

[project.scripts]
op-kingmd = "op_kingmd.cli.main:app"
okmd = "op_kingmd.cli.main:app"

[project.urls]
Homepage = "https://github.com/bigxero01/op-kingmd"
Repository = "https://github.com/bigxero01/op-kingmd"
Issues = "https://github.com/bigxero01/op-kingmd/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "PT"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --cov=op_kingmd --cov-report=term-missing"
